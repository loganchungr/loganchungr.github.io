# TEMPORARY: reads the real calendars on GitHub (which can reach Google) and saves the built lookout page to
# .calendar-test/ on Claude's working branch, without publishing anything. Deleted before merging.
name: Calendar test
on:
  push:
    branches: [claude/optimistic-cannon-iwkqzu]
    paths-ignore: [".calendar-test/**"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node build/build.js
      - name: Save the output to the branch
        run: |
          rm -rf .calendar-test && mkdir .calendar-test && cp _site/lookout.html .calendar-test/ && cp -r _site/events .calendar-test/
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f .calendar-test && git commit -q -m "Calendar test output (temporary)" && git push -q
