# TEMPORARY: reads the real calendars on GitHub (which can reach Google) and prints the lookout list, without
# publishing anything. Runs only on Claude's working branch; deleted before merging.
name: Calendar test
on:
  push:
    branches: [claude/optimistic-cannon-iwkqzu]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node build/build.js
      - name: Print the list
        run: |
          echo "LIST-START"
          sed -n '/<div class="events">/,/<\/main>/p' _site/lookout.html | gzip -9 | base64 -w0
          echo
          echo "LIST-END"
          ls _site/events | head -50
