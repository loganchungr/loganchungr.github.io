# TEMPORARY: checks the YOUTUBE_API_KEY secret against the real playlists and prints a summary, without publishing.
# Runs only on Claude's working branch; deleted before merging.
name: YouTube test
on:
  push:
    branches: [claude/optimistic-cannon-iwkqzu]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node build/build.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Summary
        run: |
          node -e '
            const d = require("./_site/watch.json"), v = Object.values(d);
            console.log("videos with details:", v.length, "| with a description:", v.filter(x => x.description).length, "| with views:", v.filter(x => x.views !== undefined).length);
            for (const [id, x] of Object.entries(d).slice(0, 3)) console.log(id, "|", x.views, "views | uploaded", x.uploaded, "|", JSON.stringify(x.description.slice(0, 80)));
          '
