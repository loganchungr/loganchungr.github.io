# Publishes the site whenever something lands on update-2 (a post from the shortcut, an edit, anything).
# It runs build/build.js, which turns the posts into pages, then puts the result on GitHub Pages.
# Needs Settings → Pages → Source set to "GitHub Actions".
name: Publish site

on:
  push:
    branches: [update-2]
  # Also at 9am, 3pm and 9pm New York time, so new calendar events reach the lookout page without a post. GitHub's
  # clock is UTC, so each time is listed for daylight time and for standard time; the "when" job keeps the right one.
  schedule:
    - cron: "0 13,19,1 * * *"   # New York on daylight time (UTC-4)
    - cron: "0 14,20,2 * * *"   # New York on standard time (UTC-5)
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab, to republish by hand

permissions:
  contents: write   # to save renamed files (see "Tidy filenames")
  issues: write     # to open an issue when the site nears GitHub Pages' size limit
  pages: write
  id-token: write

concurrency:   # if two posts arrive close together, publish them in order
  group: pages
  cancel-in-progress: false

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=America/New_York date +%z)
          if [ "$EVENT" != schedule ] || [ "$CRON|$offset" = "0 13,19,1 * * *|-0400" ] || [ "$CRON|$offset" = "0 14,20,2 * * *|-0500" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Not 9, 3 or 9 o'clock in New York at this time of year, so nothing to do"
          fi

  publish:
    needs: when
    if: needs.when.outputs.go == 'yes'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # The shortcut names a file after the note's title, so a name can start or end with spaces
      # (" 2026-10-10 in the garden  .md") or hold characters Windows can't have in a filename (* : ? " < > | \),
      # e.g. from *italics*. Tidy those names so posts sort by date and the repo opens anywhere; a post's address
      # doesn't change. If the tidy name is already taken (a post re-sent to update it), the new file replaces it.
      - name: Tidy filenames
        run: |
          renamed=""
          for f in entries/* missives/*; do
            [ -f "$f" ] || continue
            dir="${f%%/*}"; name="${f#*/}"
            tidy=$(printf '%s' "$name" | tr -d '*:?"<>|\\' | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ +(\.[A-Za-z0-9]+)?$/\1/')
            [ -n "$tidy" ] && [ "$tidy" != "$name" ] || continue
            git mv -f "$f" "$dir/$tidy"; renamed=1
          done
          if [ -n "$renamed" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Tidy filenames"
            git push -q || { git pull -q --rebase && git push -q; } || echo "::warning::Couldn't save the renamed files; the next publish will try again."
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: build
        run: node build/build.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}   # for the watch page's video details (build/youtube.js)
      # build/youtube.js keeps watch-notes.csv (your notes on the watch page's videos) in step with the playlists;
      # save it when that adds or retitles a row. Your notes are never changed.
      - name: Save the notes table
        run: |
          [ -f watch-notes.csv ] || exit 0
          git add watch-notes.csv
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Update the watch notes table"
          git push -q || { git pull -q --rebase && git push -q; } || echo "::warning::Couldn't save watch-notes.csv; the next publish will try again."
      # build.js reports when the site passes 75%, 90%, 95%, 96%... of GitHub Pages' 1 GB limit. Open one issue per level,
      # ever ("STORAGE LIMIT at 90%"); GitHub emails you about each.
      - name: Warn about site size
        if: steps.build.outputs.size_level
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: STORAGE LIMIT at ${{ steps.build.outputs.size_level }}%
          MSG: ${{ steps.build.outputs.size_warning }}
        run: |
          seen=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "\"$TITLE\" in:title" --json title --jq "map(select(.title == env.TITLE)) | length")
          [ "$seen" = 0 ] && gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$MSG" || true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
