# Publishes the site whenever something lands on update-2 (a post from the shortcut, an edit, anything but photos alone).
# It runs build/build.js, which turns the posts into pages, then puts the result on GitHub Pages.
# Needs Settings → Pages → Source set to "GitHub Actions".
name: Publish site

on:
  push:
    branches: [update-2]
    # The shortcut sends a post's photos one push at a time, before the post. Pushes of only those photos don't publish
    # (they'd show nothing new: a photo goes on the site with its post), so the post's own push starts right away.
    paths-ignore: ["entries/images/**"]
  # Also at 9am, 3pm and 9pm New York time, so new calendar events reach the lookout page without a post. GitHub's
  # clock is UTC, so each time is listed for daylight time and for standard time; the "when" job keeps the right one.
  schedule:
    - cron: "0 13,19,1 * * *"   # New York on daylight time (UTC-4)
    - cron: "0 14,20,2 * * *"   # New York on standard time (UTC-5)
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab, to republish by hand

permissions:
  contents: write   # to save renamed files (see "Tidy filenames")
  issues: write     # to open an issue when the site nears GitHub Pages' size limit
  pages: write
  id-token: write

concurrency:   # if two posts arrive close together, publish them in order
  group: publish   # (was "pages"; a run GitHub left half-finished on 2026-11-04 held that one shut)
  cancel-in-progress: false

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=America/New_York date +%z)
          if [ "$EVENT" != schedule ] || [ "$CRON|$offset" = "0 13,19,1 * * *|-0400" ] || [ "$CRON|$offset" = "0 14,20,2 * * *|-0500" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Not 9, 3 or 9 o'clock in New York at this time of year, so nothing to do"
          fi

  publish:
    needs: when
    if: needs.when.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20   # a stuck Pages deploy gives up instead of holding up the posts behind it
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:   # who the commits this run saves are from
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898283+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898283+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}   # the branch as it is now, not the commit that started the run, so a late or re-run publish never puts back an older site
          fetch-depth: 0   # the full history, so the build knows the order posts on the same day were posted
      # The shortcut sends posts to entries/ and photos to entries/images/. build/tidy.js files each post in
      # entries/YEAR/MONTH/ and each photo beside the post that shows it, and tidies filenames (see the README).
      # It's committed before the build, which reads each post's history from its filed place.
      - name: File posts and photos
        run: |
          node build/tidy.js
          git add -A entries missives
          git diff --cached --quiet || git commit -q -m "File posts and photos"
      - id: build
        run: node build/build.js   # the runner's own Node.js; the build needs no packages
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}   # for the watch page's video details (build/youtube.js)
      # Save what this run changed, in one push: the filing above, and watch-notes.csv, which build/youtube.js keeps in
      # step with the playlists (adding rows and refreshing titles, never changing your notes).
      - name: Save the changes
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          [ ! -f watch-notes.csv ] || git add watch-notes.csv
          git diff --cached --quiet || git commit -q -m "Update the watch notes table"
          [ "$(git rev-list --count "origin/$BRANCH..HEAD")" = 0 ] && exit 0
          git push -q origin "HEAD:$BRANCH" || { git pull -q --rebase origin "$BRANCH" && git push -q origin "HEAD:$BRANCH"; } \
            || echo "::warning::Couldn't save the filed posts or the notes table; the next publish will try again."
      # build.js reports when the site passes 75%, 90%, 95%, 96%... of GitHub Pages' 1 GB limit. Open one issue per level,
      # ever ("STORAGE LIMIT at 90%"); GitHub emails you about each.
      - name: Warn about site size
        if: steps.build.outputs.size_level
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: STORAGE LIMIT at ${{ steps.build.outputs.size_level }}%
          MSG: ${{ steps.build.outputs.size_warning }}
        run: |
          seen=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "\"$TITLE\" in:title" --json title --jq "map(select(.title == env.TITLE)) | length")
          [ "$seen" = 0 ] && gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$MSG" || true
      # Each attempt gets its own artifact name: a re-run ("Re-run jobs") otherwise finds the earlier attempt's
      # "github-pages" artifact too and stops with "Multiple artifacts named github-pages".
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      # GitHub Pages sometimes queues a deployment and then rejects it ("Deployment failed, try again later")
      # with nothing wrong on our side. Try up to three times, a minute or two apart, before giving up.
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - if: steps.deploy2.outcome == 'failure'
        run: sleep 120
      - id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - id: deploy
        run: echo "page_url=$URL" >> "$GITHUB_OUTPUT"
        env:
          URL: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
