<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="theme.js"></script>
<title>Loggin’ Chung</title>
<link rel="stylesheet" href="site.css">
<style>
/* Home page: month calendar, search and tags, and the post viewer. Shared styles are in site.css. */
body{font-size:1rem}
.sub{color:var(--muted);margin:0 0 2.5rem;max-width:34rem}

/* ---- Calendar ---- */
.bar{display:flex;align-items:baseline;gap:1rem;margin-bottom:1.25rem}
.bar h2{margin:0;min-width:9.5rem}
.bar .circle{width:2.25rem;height:2.25rem;background:none}
/* The calendar's width follows the window's height, so a five-week month plus the search and tags fit on screen.
   About 24rem goes to everything else (a bit more when the chyron shows); a five-row grid is 5/7 as tall as it is wide.
   Six-week months run a little past. */
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.3rem;max-width:min(60rem,max(24rem,(100vh - var(--chrome,23.75rem)) * 7 / 5))}
.dow{color:var(--muted);font-size:.8rem;margin-bottom:.4rem}
.day{aspect-ratio:1;min-width:0;display:flex;flex-direction:column;gap:.25rem;padding:.4rem;border:1px dotted var(--line);border-radius:1px;color:var(--muted);font-size:.85rem;line-height:1}
.day.out{border-color:transparent}
.day.has{padding:0;border:0}
.day.past{background:linear-gradient(to bottom right,transparent calc(50% - .5px),var(--slash) 50%,transparent calc(50% + .5px))}
.day.today{border-color:var(--accent);color:var(--accent)}
.day.today .tile{border-color:var(--accent)}

/* ---- Post tiles ---- */
.tile{flex:1;min-height:0;width:100%;padding:.5rem;text-align:left;display:flex;flex-direction:column;justify-content:space-between;
  background:var(--panel);border:1px solid var(--line);border-radius:1px;color:var(--ink);font:inherit;cursor:pointer;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile .d{font:700 clamp(1rem,3vw,1.9rem)/1 var(--font);color:var(--accent)}
.tile .t{font-size:.82rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .n{position:absolute;top:.5rem;right:.5rem;z-index:1;background:rgb(0 0 0/.55);color:#fff;font-size:.75rem;line-height:1;padding:.25rem .5rem;border-radius:999px}
.tile.photo{position:relative;overflow:hidden;color:#fff;border-color:transparent}
.tile.photo:hover{border-color:var(--accent)}
.tile.photo img,.tile.multi .s img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgb(0 0 0/.4),transparent 35% 50%,rgb(0 0 0/.7))}
.tile.photo .d,.tile.photo .t{position:relative;z-index:1;color:#fff;text-shadow:0 1px 3px rgb(0 0 0/.5)}
/* A day with several posts splits its tile: two side by side, three or more in a grid of four. */
.tile.multi{position:relative;overflow:hidden;padding:0}
.tile.multi .sub{position:absolute;inset:0;width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.tile.multi .sub.four{grid-template-rows:1fr 1fr}
.tile.multi .s{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--panel);display:flex;align-items:flex-end;padding:.4rem;font-size:.7rem;line-height:1.25}
.tile.multi .s span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.multi .d{position:absolute;top:.5rem;left:.5rem;z-index:1}
.tile.multi.dark .d{color:#fff;text-shadow:0 1px 3px rgb(0 0 0/.6)}
/* Calendar tiles show just the date (and cover photo); titles appear in the picker and the post. */
#cal .tile .t,#cal .tile.multi .s span{display:none}

/* ---- Missives: a chyron of the newest short notes, stuck to the bottom of the screen ---- */
.chyron{position:fixed;left:0;right:0;bottom:0;z-index:4;overflow:hidden;white-space:nowrap;padding:.3rem 1.5rem calc(.3rem + env(safe-area-inset-bottom,0px));
  border-top:1px dotted var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent);font-size:.75rem;cursor:default}
body:has(.chyron:not([hidden])){--chrome:25.5rem}
body:has(.chyron:not([hidden])) main{padding-bottom:6rem}
body:has(.chyron:not([hidden])) .theme-toggle{bottom:calc(2.6rem + env(safe-area-inset-bottom,0px))}
.chyron .track{display:inline-flex;animation:ticker var(--dur,40s) linear infinite}
.chyron:hover .track,.chyron.paused .track{animation-play-state:paused}
.chyron .m::after{content:"✶";color:var(--accent);font-size:.65rem;font-style:normal;padding:0 1.25rem}
.chyron .ago{color:var(--muted);font-size:.65rem;font-style:normal;margin-left:.5rem;font-variant-numeric:tabular-nums}
@keyframes ticker{to{transform:translateX(-50%)}}
@media (max-width:40rem){
  /* On phones: smaller text, and only half the home-bar allowance so the band stays slim */
  .chyron{font-size:.65rem;padding:.2rem 1rem calc(.2rem + env(safe-area-inset-bottom,0px) / 2)}
  .chyron .m::after{padding:0 .9rem}
  body:has(.chyron:not([hidden])) .theme-toggle{bottom:calc(2.1rem + env(safe-area-inset-bottom,0px) / 2)}
}
@media (prefers-reduced-motion:reduce){.chyron{overflow-x:auto}.chyron .track{animation:none}.chyron [aria-hidden]{display:none}}

/* ---- Search and tags ---- */
.tools{display:flex;flex-direction:column;gap:.9rem;margin-top:2.5rem}
.search{display:flex;gap:.5rem;align-items:center;max-width:26rem}
.search input{flex:1}
.tagrow{display:flex;flex-wrap:nowrap;gap:1rem;overflow-x:auto;padding-bottom:.5rem;max-width:26rem}
/* Tags are quiet grey text; hovering or selecting one fills it like the nav links. */
.tag{flex-shrink:0;white-space:nowrap;font:inherit;font-size:.85rem;line-height:1.5;color:var(--muted);border:0;background:none;padding:0;cursor:pointer;text-decoration:none;display:inline-block}
.tag small{margin-left:.3rem}
.or{font-size:.85rem;color:var(--muted);white-space:nowrap}
.tag:hover,.tag.on{background:var(--accent);color:#000}
.count{color:var(--muted);font-size:.9rem;margin:0 0 .5rem}
.rm{font:400 1.5rem/1 var(--font);margin:1.5rem 0 .4rem}
.res{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:.8rem 0;font:inherit;color:var(--ink);cursor:pointer}
.res:hover .rt{color:var(--accent)}
.rd{color:var(--muted);font-size:.85rem;margin-right:.5rem}
.rt{font-weight:600}
.rs{color:var(--muted);font-size:.9rem}
mark{background:color-mix(in srgb,var(--accent) 25%,transparent);color:inherit}

/* ---- Post viewer ---- */
article{font-size:.9rem}
.when{color:var(--muted);font-size:.9rem;margin:0 0 .25rem}
article h1{font-size:2rem;margin:0 0 1.25rem}
article h2{font-size:1.7rem;line-height:1.15;margin:1.8rem 0 .5rem;text-align:center}  /* site rule: ## headings are centered */
article h3{margin-top:1.5rem}
article p,article ul,article ol,article blockquote,article pre{margin:0 0 1rem}
article a{color:var(--accent);text-decoration:underline dotted;text-underline-offset:.2em}
article a:hover{background:none;color:var(--accent)}
article blockquote{border-left:3px solid var(--accent);padding-left:1rem;font-style:italic}
article blockquote p:last-child{margin:0}
article code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;background:var(--bg);padding:.1em .3em;border-radius:3px}
article pre{background:var(--bg);padding:1rem;overflow-x:auto;border-radius:3px}
article pre code{background:none;padding:0}
article hr{border:0;border-top:1px solid var(--line);margin:1.5rem 0}
/* A lone photo is capped at about a third of the screen; back-to-back photos become a grid of squares. Tap to see one whole. */
article img{display:block;width:auto;max-width:100%;height:auto;max-height:min(22rem,40vh);margin:0 auto 1rem;border-radius:1px;cursor:zoom-in}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.35rem;margin:0 0 1rem}
.photos.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.photos img{width:100%;max-height:none;aspect-ratio:1;object-fit:cover;margin:0}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(8rem,1fr));gap:.75rem}
.pick .tile{aspect-ratio:1}
.pick img{margin:0;cursor:pointer}
.back{font:inherit;background:none;border:0;padding:0;color:inherit;text-decoration:underline dotted;text-underline-offset:.2em;cursor:pointer}
.back:hover{color:var(--ink)}
#zoom::backdrop{background:rgb(0 0 0/.9)}
#zoom[open]{display:grid;place-items:center;cursor:zoom-out}
#zoom img{max-width:96vw;max-height:94vh;object-fit:contain}
#zoom .circle{position:fixed;top:50%;width:2.75rem;height:2.75rem;margin-top:-1.375rem;font-size:1.1rem;opacity:.85}
#zprev{left:calc(.75rem + env(safe-area-inset-left,0px))}#znext{right:calc(.75rem + env(safe-area-inset-right,0px))}

@media (max-width:48rem){
  /* On phones the arrows float in the bottom corners, so you can move between posts without scrolling to the end. */
  .wrap{grid-template-columns:1fr;padding:3rem .75rem calc(5rem + env(safe-area-inset-bottom,0px))}
  #art{padding:1.5rem 1.25rem;max-height:none}
  .nav{position:fixed;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:1;width:2.75rem;height:2.75rem;box-shadow:0 2px 10px rgb(0 0 0/.3)}
  .nav:disabled{visibility:hidden}
  #prev{left:calc(1rem + env(safe-area-inset-left,0px))}#next{right:calc(1rem + env(safe-area-inset-right,0px))}
  .close{z-index:1;width:2.25rem;height:2.25rem;padding:0;border-radius:50%;border:1px dotted var(--line);background:var(--panel);color:var(--ink);font-size:1rem;box-shadow:0 2px 10px rgb(0 0 0/.3)}
}
@media (max-width:40rem){
  .dow,.grid{gap:.2rem}
  .day{padding:.3rem;font-size:.75rem}
  .tile{padding:.3rem}
  .tile.multi .d{top:.3rem;left:.3rem}
  #cal .tile .n{top:.2rem;right:.2rem;font-size:.55rem;padding:.1rem .25rem}
}
</style>
  
</head>
  
<body>
<main>
  <h1>Loggin’ Chung</h1>
  <nav class="links"><a href="lookout.html">lookout</a><a href="context.html">context</a><a href="tv.html">TV</a></nav>
  <p class="sub" id="note" hidden></p>
  <div id="calwrap">
  <div class="bar">
    <button class="circle" id="pm" aria-label="Previous month">←</button>
    <h2 id="mt"></h2>
    <button class="circle" id="nm" aria-label="Next month">→</button>
  </div>
  <div class="dow" aria-hidden="true"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
  <div class="grid" id="cal"></div>
  </div>
  <div id="results" hidden></div>
  <div class="tools">
    <div class="search"><input id="q" type="text" placeholder="Search entries" aria-label="Search entries" autocomplete="off"><button id="clear" class="tag" hidden>Clear</button><span id="arch" class="or"><em>or</em> <a class="tag" href="archive.html">archive</a></span></div>
    <div class="tagrow" id="tags"></div>
  </div>
</main>
<div class="chyron" id="chyron" aria-label="Missives" hidden><div class="track"></div></div>

<dialog id="lb" aria-label="Entry">
  <button class="close" id="x" aria-label="Close">✕</button>
  <div class="wrap">
    <button class="circle nav" id="prev" aria-label="Older entry">←</button>
    <article id="art"></article>
    <button class="circle nav" id="next" aria-label="Newer entry">→</button>
  </div>
</dialog>

<dialog id="zoom" aria-label="Photo">
  <button class="circle" id="zprev" aria-label="Previous photo">←</button>
  <img id="zimg" alt="">
  <button class="circle" id="znext" aria-label="Next photo">→</button>
</dialog>

<script>
/* Posts come from posts.json, which build/build.js makes from entries/ each time the site is published. */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---- Calendar ---- */
const parse = s => {const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
let entries = [], first, last;
function ingest(raw){
  entries = raw.map(r=>({...r, d:parse(r.date), photos:r.photos||0, text:r.title.toLowerCase(), plain:""}));
  first = entries.length ? entries[0].d : today;
  last = entries.length && entries[entries.length-1].d > today ? entries[entries.length-1].d : today;
}
const MON = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const mon3 = d => MON[d.getMonth()].slice(0,3);
const weekStart = d => {const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const $ = id => document.getElementById(id);
const today = new Date();
let view = {y:today.getFullYear(), m:today.getMonth()};

const qa = s => esc(s).replace(/"/g,"&quot;");
const tile = e => {
  const i = entries.indexOf(e), n = e.photos, d = `<span class="d">${e.d.getDate()}</span>`;
  if(!n) return `<button class="tile" data-i="${i}" aria-label="${qa(mon3(e.d)+" "+e.d.getDate()+", "+e.title)}">${d}<span class="t">${esc(e.title)}</span></button>`;
  return `<button class="tile photo" data-i="${i}" aria-label="${qa(mon3(e.d)+" "+e.d.getDate()+", "+(e.untitled?"Photos":e.title)+", "+n+(n===1?" photo":" photos"))}"><img src="${qa(e.photo)}" alt="" loading="lazy">`+
    d+(e.untitled?"":`<span class="t">${esc(e.title)}</span>`)+`</button>`;
};
/* Shows the day's four most recent posts; the bubble counts all of them. */
const multiTile = day => {
  const e = day[0], shown = day.slice(-4);
  const sub = shown.map(x=>`<span class="s">`+(x.photos?`<img src="${qa(x.photo)}" alt="" loading="lazy">`:`<span>${esc(x.title)}</span>`)+`</span>`).join("")+(shown.length===3?`<span class="s"></span>`:"");
  return `<button class="tile multi${shown[0].photos?" dark":""}" data-day="${e.date}" aria-label="${qa(mon3(e.d)+" "+e.d.getDate()+", "+day.length+" posts")}">`+
    `<span class="sub${shown.length>2?" four":""}">${sub}</span><span class="d">${e.d.getDate()}</span><span class="n">${day.length}</span></button>`;
};
function render(){
  $("mt").textContent = MON[view.m]+" "+view.y;
  const monthEnd = new Date(view.y,view.m+1,0), cells = [];
  const midnight = new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const isToday = d => d.getFullYear()===today.getFullYear() && d.getMonth()===today.getMonth() && d.getDate()===today.getDate();
  for(let d = weekStart(new Date(view.y,view.m,1)); d <= monthEnd || d.getDay()!==1; d = new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)){
    if(d.getMonth()!==view.m){cells.push(`<div class="day out"></div>`);continue}
    const day = entries.filter(e=>+e.d===+d), now = isToday(d) ? " today" : d < midnight ? " past" : "";
    cells.push(day.length ? `<div class="day has${now}">${day.length > 1 ? multiTile(day) : tile(day[0])}</div>`
      : `<div class="day${now}"${now===" today"?' aria-current="date"':""}>${d.getDate()}</div>`);
  }
  $("cal").innerHTML = cells.join("");
  $("pm").disabled = view.y===first.getFullYear() && view.m===first.getMonth();
  $("nm").disabled = view.y===last.getFullYear() && view.m===last.getMonth();
}
function shift(n){const d=new Date(view.y,view.m+n,1);view={y:d.getFullYear(),m:d.getMonth()};render()}
$("pm").onclick=()=>shift(-1); $("nm").onclick=()=>shift(1);

/* ---- Lightbox ---- */
const lb = $("lb");
/* The lightbox shows one post, or a picker for a day with several. span holds the list positions it covers. */
let span = [-1,-1];
const longDate = d => d.toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
/* Each post has its own address (#2026-09-12-i-m-thirty), and a day with several posts has its date (#2026-10-23),
   so what's open can be shared. Opening the lightbox adds one step to the browser's history; moving around inside it
   just updates the address, so the back button closes it in one step, like the ✕. */
let stepped = false;  // whether opening the lightbox added that history step
function present(e,html,from,to,where,fromLink){
  span = [from,to];
  $("art").innerHTML = html; $("art").scrollTop = 0; lb.scrollTop = 0;
  $("prev").disabled = from<=0; $("next").disabled = to<0||to>=list.length-1;
  view = {y:e.d.getFullYear(), m:e.d.getMonth()}; render();
  if(lb.open||fromLink) history.replaceState(null,"","#"+where); else {history.pushState(null,"","#"+where); stepped = true}
  if(!lb.open) lb.showModal();
}
lb.addEventListener("close",()=>{
  if(stepped){stepped = false; history.back()}
  else if(location.hash) history.replaceState(null,"",location.pathname+location.search);
});
addEventListener("popstate",()=>{
  if(lb.open){stepped = false; if(zoom.open) zoom.close(); lb.close()}
  else if(fromAddress()) stepped = true;  // came forward from the home page, so closing goes back to it
});
const slug = e => e.url.slice(6,-5);  // "posts/2026-09-12-i-m-thirty.html" → "2026-09-12-i-m-thirty"
function fromAddress(){
  const where = decodeURIComponent(location.hash.slice(1)), i = entries.findIndex(e=>slug(e)===where);
  if(i>=0) show(i,true); else if(entries.some(e=>e.date===where)) showDay(where,true); else return false;
  return true;
}
/* Each post is its own page in posts/; the lightbox fetches one when it's opened and keeps it for the visit. */
const pages = {};
const post = e => pages[e.url] || (pages[e.url] = fetch(e.url,{cache:"no-cache"}).then(r=>{if(!r.ok)throw r.status;return r.text()})
  .then(t=>new DOMParser().parseFromString(t,"text/html").querySelector("article").innerHTML)
  .catch(err=>{delete pages[e.url];throw err}));
let ticket = 0;  // so a slow fetch can't replace a post opened after it
async function show(i,fromLink){
  if(i<0||i>=entries.length) return;
  const e = entries[i], p = list.indexOf(i), n = entries.filter(x=>x.date===e.date).length, mine = ++ticket;
  let body;
  try{ body = await post(e) }catch(err){ body = `<p>Couldn’t load this post. <a href="${qa(e.url)}">Try its own page</a>.</p>` }
  if(mine!==ticket) return;
  present(e,`<p class="when">${longDate(e.d)}`+(n>1?` · <button class="back" data-day="${e.date}">${n} posts</button>`:"")+`</p>`+body,p,p,slug(e),fromLink);
  [list[p-1],list[p+1]].forEach(j=>{if(j!==undefined)post(entries[j]).catch(()=>{})});  // ready for the arrows
}
function showDay(date,fromLink){
  ticket++;
  const ps = list.map((i,p)=>[i,p]).filter(([i])=>entries[i].date===date);
  if(!ps.length) return;
  const e = entries[ps[0][0]];
  present(e,`<p class="when">${longDate(e.d)} · ${ps.length} posts</p><div class="pick">${ps.map(([i])=>tile(entries[i])).join("")}</div>`,ps[0][1],ps[ps.length-1][1],date,fromLink);
}
$("cal").addEventListener("click",ev=>{const t=ev.target.closest("[data-day],[data-i]");if(!t)return;t.dataset.day?showDay(t.dataset.day):show(+t.dataset.i)});
$("art").addEventListener("click",ev=>{const t=ev.target.closest(".pick [data-i],.back");if(!t)return;t.dataset.day?showDay(t.dataset.day):show(+t.dataset.i)});
function step(n){const p=n<0?span[0]-1:span[1]+1;if(p>=0&&p<list.length)show(list[p])}
$("prev").onclick=()=>step(-1); $("next").onclick=()=>step(1);
$("x").onclick=()=>lb.close();
const zoom = $("zoom");
/* Tapping a photo shows it whole; arrows, arrow keys or a swipe move through the post's other photos. */
let shots = [], shot = 0;
function zoomTo(i){shot=(i+shots.length)%shots.length;$("zimg").src=shots[shot].src;$("zimg").alt=shots[shot].alt;$("zprev").hidden=$("znext").hidden=shots.length<2}
$("art").addEventListener("click",ev=>{const im=ev.target.closest("img");if(!im||im.closest(".pick"))return;
  shots=[...$("art").querySelectorAll("img")].filter(x=>!x.closest(".pick"));zoomTo(shots.indexOf(im));zoom.showModal()});
$("zprev").onclick=ev=>{ev.stopPropagation();zoomTo(shot-1)}; $("znext").onclick=ev=>{ev.stopPropagation();zoomTo(shot+1)};
zoom.addEventListener("keydown",ev=>{if(ev.key==="ArrowLeft"){ev.preventDefault();zoomTo(shot-1)}if(ev.key==="ArrowRight"){ev.preventDefault();zoomTo(shot+1)}});
let touchX = null;
zoom.addEventListener("touchstart",ev=>{touchX=ev.touches[0].clientX},{passive:true});
zoom.addEventListener("touchend",ev=>{if(touchX===null)return;const dx=ev.changedTouches[0].clientX-touchX;touchX=null;if(Math.abs(dx)>40){ev.preventDefault();zoomTo(shot+(dx<0?1:-1))}});
zoom.addEventListener("click",()=>zoom.close());
lb.addEventListener("click",ev=>{if(ev.target===lb||ev.target.classList.contains("wrap"))lb.close()});
lb.addEventListener("keydown",ev=>{
  if(ev.key==="ArrowLeft"){ev.preventDefault();step(-1)}
  if(ev.key==="ArrowRight"){ev.preventDefault();step(1)}
});
/* ---- Search & tags ---- */
let list = entries.map((_,i)=>i), q = "", sel = new Set();
const allTags = () => {const m={};entries.forEach(e=>e.tags.forEach(t=>m[t]=(m[t]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))};
const terms = () => q.toLowerCase().split(/\s+/).filter(Boolean);
const matches = e => [...sel].every(t=>e.tags.includes(t)) && terms().every(w=>e.text.includes(w));
/* Searching needs every post's text, so search.json loads the first time someone uses the search box.
   Until it arrives, searches match titles only. */
let searchText = null;
function loadSearch(){
  searchText = searchText || fetch("search.json",{cache:"no-cache"}).then(r=>r.json()).then(t=>{
    entries.forEach(e=>{e.plain=t[e.id]||"";e.text=(e.title+" "+e.plain).toLowerCase()});draw();
  }).catch(()=>{searchText=null});
}
function snippet(e,ts){
  const t = e.plain, low = t.toLowerCase(); let at = 0;
  for(const w of ts){const k=low.indexOf(w);if(k>=0){at=Math.max(0,k-50);break}}
  let s = esc(t.slice(at,at+150));
  ts.forEach(w=>{s=s.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),m=>"<mark>"+m+"</mark>")});
  return (at?"…":"")+s+(at+150<t.length?"…":"");
}
function draw(){
  const on = q.trim() || sel.size;
  $("calwrap").hidden = !!on; $("results").hidden = !on; $("clear").hidden = !on; $("arch").hidden = !!on;
  $("tags").innerHTML = allTags().map(([t,n])=>`<button class="tag${sel.has(t)?" on":""}" data-tag="${t}" aria-pressed="${sel.has(t)}">#${t}<small>${n}</small></button>`).join("");
  if(!on){list = entries.map((_,i)=>i);return}
  const ts = terms();
  list = entries.map((_,i)=>i).filter(i=>matches(entries[i]));
  let html = `<p class="count" aria-live="polite">${list.length} ${list.length===1?"entry":"entries"}</p>`, mk = "";
  [...list].reverse().forEach(i=>{
    const e = entries[i], k = MON[e.d.getMonth()]+" "+e.d.getFullYear();
    if(k!==mk){mk=k;html+=`<h3 class="rm">${k}</h3>`}
    html += `<button class="res" data-i="${i}"><span class="rd">${mon3(e.d)} ${e.d.getDate()}</span><span class="rt">${esc(e.title)}</span><br><span class="rs">${snippet(e,ts)}</span></button>`;
  });
  if(!list.length) html += `<p class="rs">Nothing matches. Try fewer words or clear a tag.</p>`;
  $("results").innerHTML = html;
}
$("q").addEventListener("focus",loadSearch);
$("q").addEventListener("input",ev=>{q=ev.target.value;loadSearch();draw()});
$("q").addEventListener("keydown",ev=>{if(ev.key==="Escape"){q="";ev.target.value="";draw()}});
$("clear").onclick = () => {q="";sel.clear();$("q").value="";draw()};
$("tags").addEventListener("click",ev=>{const t=ev.target.closest("[data-tag]");if(!t)return;const g=t.dataset.tag;sel.has(g)?sel.delete(g):sel.add(g);draw()});
$("art").addEventListener("click",ev=>{const t=ev.target.closest("[data-tag]");if(!t)return;ev.preventDefault();lb.close();q="";$("q").value="";sel=new Set([t.dataset.tag]);draw();window.scrollTo(0,0)});
$("results").addEventListener("click",ev=>{const r=ev.target.closest(".res");if(r)show(+r.dataset.i)});
document.addEventListener("keydown",ev=>{if(ev.key==="/"&&!lb.open&&document.activeElement!==$("q")){ev.preventDefault();$("q").focus()}});
/* ---- Missives: the newest few files in missives/, named by date and time (2026-10-24-091512.md), scroll past in the chyron ---- */
const stamp = n => {const [,y,mo,d,h=0,mi=0,se=0]=n.match(/^(\d{4})-(\d{2})-(\d{2})(?:-(\d{2})(\d{2})(\d{2})?)?/);return new Date(y,mo-1,d,h,mi,se)};
const pad = n => String(n).padStart(2,"0");
// Age in two or three characters: 05m, 23h, 2d.
const ago = d => {const m=Math.max(1,Math.floor((Date.now()-d)/6e4));return m<60?pad(m)+"m":m<=1440?pad(Math.round(m/60))+"h":Math.floor(m/1440)+"d"};
function chyron(list){
  if(!list.length) return;
  const group = list.map(m=>`<span class="m"><em>${m.html}</em><span class="ago">${ago(stamp(m.at))}</span></span>`).join("");
  const c = $("chyron"), t = c.firstElementChild;
  t.innerHTML = `<span>${group}</span><span aria-hidden="true">${group}</span>`;  // a second copy makes the loop seamless
  c.hidden = false;
  t.style.setProperty("--dur", Math.max(20, t.firstElementChild.offsetWidth/40)+"s");  // about 40px a second
  c.onclick = () => c.classList.toggle("paused");  // tap to pause on phones
}
/* ---- Load ---- */
fetch("posts.json",{cache:"no-cache"}).then(r=>r.json())
  .then(({posts,missives})=>{ingest(posts);draw();render();chyron(missives);fromAddress()})
  .catch(()=>{const n=$("note");n.textContent="Couldn’t load the entries. Try refreshing.";n.hidden=false;ingest([]);draw();render()});
</script>
