<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="theme.js"></script>
<title>Loggin’ Chung</title>
<style>
:root{
  --bg:#fffbfa; --panel:#fff8f6; --ink:#000000; --muted:#6b6b6b; --line:#969696;
  --tile:#fff8f6; --bgimg:none; --slash:rgba(150,150,150,.3); --accent:#FF948F;--accent-ink:#FF948F; --scrim:rgba(0,0,0,.5);
  --serif:"Courier New",Courier,monospace;
  --display:"Courier New",Courier,monospace;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#12161e;--panel:#1b212c;--ink:#e6eaf1;--muted:#8b95a7;--line:#303949;--tile:#1b212c;--bgimg:linear-gradient(rgba(18,22,30,.55),rgba(18,22,30,.55)),url(images/pale-blue-dot.jpg);--slash:rgba(48,57,73,.55);--accent:#FF948F;--accent-ink:#FF948F;--scrim:rgba(0,0,0,.65);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#12161e;--panel:#1b212c;--ink:#e6eaf1;--muted:#8b95a7;--line:#303949;--tile:#1b212c;--bgimg:linear-gradient(rgba(18,22,30,.55),rgba(18,22,30,.55)),url(images/pale-blue-dot.jpg);--slash:rgba(48,57,73,.55);--accent:#FF948F;--accent-ink:#FF948F;--scrim:rgba(0,0,0,.65);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--serif)}
/* Dark theme only: a blurred Pale Blue Dot behind everything, under a wash of the background so text stays readable. */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bgimg) center/cover no-repeat}
main{max-width:64rem;padding:3rem 1.5rem 5rem;margin:0}
h1{font:700 clamp(2.2rem,8vw,2.75rem)/1 var(--display);margin:0 0 .5rem}
.sub{color:var(--muted);margin:0 0 2.5rem;max-width:34rem}
.links{display:flex;gap:1.5rem}
.links a{color:var(--ink);text-decoration:underline dotted;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:.25em}
.links a:hover{background:var(--accent);color:#000;text-decoration-color:transparent}
.bar{display:flex;align-items:baseline;gap:1rem;margin-bottom:1.25rem}
.bar h2{font:400 1.75rem/1 var(--display);margin:0;min-width:9.5rem}
.bar button{font:inherit;background:none;border:1px dotted var(--line);color:var(--ink);width:2.25rem;height:2.25rem;border-radius:50%;cursor:pointer}
.bar button:hover:not(:disabled){border-color:var(--accent);color:var(--accent-ink)}
.bar button:disabled{opacity:.3;cursor:default}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.3rem;max-width:60rem}
.dow{color:var(--muted);font-size:.8rem;margin-bottom:.4rem}
.day{aspect-ratio:1;min-width:0;display:flex;flex-direction:column;gap:.25rem;padding:.4rem;border:1px dotted var(--line);border-radius:1px;color:var(--muted);font-size:.85rem;line-height:1}
.day.out{border-color:transparent}
.day.has{padding:0;border:0}
.day.past{background:linear-gradient(to bottom right,transparent calc(50% - .5px),var(--slash) 50%,transparent calc(50% + .5px))}
.day.today{border-color:var(--accent);color:var(--accent-ink)}
.day.today .tile{border-color:var(--accent)}
.tile{flex:1;min-height:0;width:100%;padding:.5rem;text-align:left;display:flex;flex-direction:column;justify-content:space-between;
  background:var(--tile);border:1px solid var(--line);border-radius:1px;color:var(--ink);font:inherit;cursor:pointer;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile .d{font:700 clamp(1rem,3vw,1.9rem)/1 var(--display);color:var(--accent-ink)}
.tile.photo{position:relative;overflow:hidden;color:#fff;border-color:transparent}
.tile.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* Calendar photos are softly blurred so titles read clearly; the lightbox shows them sharp. Scaling hides the blur's faded edges. */
#cal .tile img{filter:blur(3px);transform:scale(1.08)}
/* No titles on the calendar, just dates; titles appear in the picker and the post. */
#cal .tile .t,#cal .tile.multi .s span{display:none}
.tile.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.4),rgba(0,0,0,0) 35%,rgba(0,0,0,0) 50%,rgba(0,0,0,.7))}
.tile.photo .d,.tile.photo .t{position:relative;z-index:1;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.tile.photo:hover{border-color:var(--accent)}
.tile .t{font-size:.82rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* A day with several posts splits its tile: two side by side, three or more in a grid of four. */
.tile.multi{position:relative;overflow:hidden;padding:0}
.tile.multi .sub{position:absolute;inset:0;width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr}
.tile.multi .sub.four{grid-template-rows:1fr 1fr}
.tile.multi .s{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--tile);display:flex;align-items:flex-end;padding:.4rem;font-size:.7rem;line-height:1.25}
.tile.multi .s img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.multi .s span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.multi .d{position:absolute;top:.5rem;left:.5rem;z-index:1}
.tile.multi.dark .d{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tile .n{position:absolute;top:.5rem;right:.5rem;z-index:1;background:rgba(0,0,0,.55);color:#fff;font-size:.75rem;line-height:1;padding:.25rem .5rem;border-radius:999px}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
[hidden]{display:none!important}
.tools{display:flex;flex-direction:column;gap:.9rem;margin-top:2.5rem}
.search{display:flex;gap:.5rem;align-items:center;max-width:26rem}
.search input{flex:1;font:inherit;padding:.5rem .75rem;border:1px dotted var(--line);border-radius:1px;background:var(--panel);color:var(--ink)}
.tagrow{display:flex;flex-wrap:nowrap;gap:1rem;overflow-x:auto;padding-bottom:.5rem;max-width:26rem}
/* Tags are quiet grey text; hovering or selecting one fills it like the nav links. */
.tag{flex-shrink:0;white-space:nowrap;font:inherit;font-size:.85rem;line-height:1.5;color:var(--muted);border:0;background:none;padding:0;cursor:pointer;text-decoration:none;display:inline-block}
.tag small{margin-left:.3rem}
.tag:hover,.tag.on{background:var(--accent);color:#000}
.count{color:var(--muted);font-size:.9rem;margin:0 0 .5rem}
.rm{font:400 1.5rem/1 var(--display);margin:1.5rem 0 .4rem}
.res{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:.8rem 0;font:inherit;color:var(--ink);cursor:pointer}
.res:hover .rt{color:var(--accent-ink)}
.rd{color:var(--muted);font-size:.85rem;margin-right:.5rem}
.rt{font-weight:600}
.rs{color:var(--muted);font-size:.9rem}
mark{background:color-mix(in srgb,var(--accent) 25%,transparent);color:inherit}
@media (max-width:40rem){
  .dow,.grid{gap:.2rem}
  .day{padding:.3rem;font-size:.75rem}
  .tile{padding:.3rem}
  #cal .tile .t,#cal .tile.multi .s span{display:none}
  .tile.multi .d{top:.3rem;left:.3rem}
  #cal .tile .n{top:.2rem;right:.2rem;font-size:.55rem;padding:.1rem .25rem}
}

dialog{border:0;padding:0;background:transparent;width:100%;max-width:none;height:100%;max-height:none;color:var(--ink)}
dialog::backdrop{background:var(--scrim)}
.wrap{min-height:100%;display:grid;grid-template-columns:3rem minmax(0,44rem) 3rem;gap:1rem;justify-content:center;align-items:center;padding:2rem 1rem}
article{font-size:.85rem;background:var(--panel);border:1px dotted var(--line);border-radius:1px;padding:2.25rem 2.5rem;max-height:calc(100vh - 4rem);overflow:auto}
.nav{width:3rem;height:3rem;border-radius:50%;border:1px dotted var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:1.2rem;cursor:pointer}
.nav:hover:not(:disabled){border-color:var(--accent);color:var(--accent-ink)}
.nav:disabled{opacity:.3;cursor:default}
.close{position:fixed;top:calc(.75rem + env(safe-area-inset-top,0px));right:1rem;background:none;border:0;color:#fff;font-size:1.6rem;cursor:pointer}
.when{color:var(--muted);font-size:.9rem;margin:0 0 .25rem}
article h1{font-size:2rem;margin:0 0 1.25rem}
article h2{font:400 1.7rem/1.15 var(--display);margin:1.8rem 0 .5rem}
article h3{font:600 1.05rem/1.3 var(--serif);margin:1.5rem 0 .4rem}
article p,article ul,article ol,article blockquote,article pre{margin:0 0 1rem}
article a{color:var(--accent-ink);text-decoration-style:dotted;text-underline-offset:.2em}
article blockquote{border-left:3px solid var(--accent);padding-left:1rem;color:var(--muted);font-style:italic}
article code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;background:var(--bg);padding:.1em .3em;border-radius:3px}
article pre{background:var(--bg);padding:1rem;overflow-x:auto;border-radius:3px}
article pre code{background:none;padding:0}
article hr{border:0;border-top:1px solid var(--line);margin:1.5rem 0}
article blockquote p{margin:0 0 .35rem}
article blockquote p:last-child{margin:0}
article img{display:block;max-width:100%;height:auto;margin:0 0 1rem;border-radius:3px;cursor:zoom-in}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(8rem,1fr));gap:.75rem}
.pick .tile{aspect-ratio:1}
.pick img{margin:0;cursor:pointer}
.back{font:inherit;background:none;border:0;padding:0;color:inherit;text-decoration:underline dotted;text-underline-offset:.2em;cursor:pointer}
.back:hover{color:var(--ink)}
#zoom::backdrop{background:rgba(0,0,0,.9)}
#zoom[open]{display:grid;place-items:center;cursor:zoom-out}
#zoom img{max-width:96vw;max-height:94vh;object-fit:contain}
@media (max-width:48rem){
  /* On phones the arrows float in the bottom corners, so you can move between posts without scrolling to the end. */
  .wrap{grid-template-columns:1fr;padding:3rem .75rem calc(5rem + env(safe-area-inset-bottom,0px))}
  article{padding:1.5rem 1.25rem;max-height:none}
  .nav{position:fixed;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:1;width:2.75rem;height:2.75rem;box-shadow:0 2px 10px rgba(0,0,0,.3)}
  .nav:disabled{visibility:hidden}
  #prev{left:calc(1rem + env(safe-area-inset-left,0px))}#next{right:calc(1rem + env(safe-area-inset-right,0px))}
  .close{z-index:1;width:2.25rem;height:2.25rem;padding:0;border-radius:50%;border:1px dotted var(--line);background:var(--panel);color:var(--ink);font-size:1rem;box-shadow:0 2px 10px rgba(0,0,0,.3)}
}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
  
</head>
  
<body>
<main>
  <h1>Loggin’ Chung</h1>
  <nav class="sub links"><a href="lookout.html">lookout</a><a href="context.html">context</a></nav>
  <p class="sub" id="note" hidden></p>
  <div id="calwrap">
  <div class="bar">
    <button id="pm" aria-label="Previous month">←</button>
    <h2 id="mt"></h2>
    <button id="nm" aria-label="Next month">→</button>
  </div>
  <div class="dow" aria-hidden="true"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
  <div class="grid" id="cal"></div>
  </div>
  <div id="results" hidden></div>
  <div class="tools">
    <div class="search"><input id="q" type="text" placeholder="Search entries" aria-label="Search entries" autocomplete="off"><button id="clear" class="tag" hidden>Clear</button></div>
    <div class="tagrow" id="tags"></div>
  </div>
</main>

<dialog id="lb" aria-label="Entry">
  <button class="close" id="x" aria-label="Close">✕</button>
  <div class="wrap">
    <button class="nav" id="prev" aria-label="Older entry">←</button>
    <article id="art"></article>
    <button class="nav" id="next" aria-label="Newer entry">→</button>
  </div>
</dialog>

<dialog id="zoom" aria-label="Photo"><img id="zimg" alt=""></dialog>

<script>
/* ---- Config ---- */
const REPO = "";           // "yourname/yourrepo"; leave empty to auto-detect on yourname.github.io
const FOLDER = "entries";  // folder of posts named YYYY-MM-DD-anything.md
const BRANCH = "update-2";         // leave empty for the default branch
/* Photo paths in a post are read relative to the entries folder, so ![](images/a.jpg) works,
   and so does ![](entries/images/a.jpg). Full web addresses are left alone. */
const imgSrc = s => /^(https?:|data:|\/|entries\/)/i.test(s) ? s : FOLDER+"/"+s;

/* ---- Sample entries, shown only if the repo can't be read. Safe to delete. ---- */
const demo = [
 {date:"2026-09-03",title:"Starting over, again",body:"# Starting over, again\n\nI keep a **new notebook** every few months. This one is a website.\n\n- Fewer excuses\n- No formatting rituals\n- Everything in one place\n\nA first post. #meta #notebook"},
 {date:"2026-09-10",title:"On slow mornings",body:"# On slow mornings\n\nThe best hour of the day is the one before anyone expects anything of me.\n\n> Do less, but notice more.\n\nI’m trying to protect it.\n\n#mornings #slowliving"},
 {date:"2026-09-18",title:"Reading list, September",body:"# Reading list, September\n\n1. A novel I keep abandoning\n2. A book of essays on walking\n3. Old *New Yorker* issues\n\nSee [the library](https://example.com) for holds."},
 {date:"2026-09-29",title:"What I’d tell my past self",body:"# What I’d tell my past self\n\nStart before you’re ready. The *draft* is allowed to be bad."},
 {date:"2026-10-01",title:"October, a plan",body:"# October, a plan\n\nThree small goals:\n\n1. Write every week\n2. Walk daily\n3. Ship one tiny project\n\nSee also #walking and #meta."},
 {date:"2026-10-06",title:"Notes on a long walk",body:"# Notes on a long walk\n\nSix miles, no podcast. Ideas arrive when you stop asking for them.\n\n---\n\nA short list of things I noticed:\n\n- A heron on the canal\n- Someone practicing trumpet\n- My own pace slowing down\n\n#walking #notes"},
 {date:"2026-10-08",title:"Tools I actually use",body:"# Tools I actually use\n\n## Writing\n\nPlain text, `vim`, and a folder.\n\n## Thinking\n\nPaper. Always paper.\n\n```\nnotes/\n  2026/\n    10.md\n```\n\n#tools #notes"},
 {date:"2026-10-14",title:"A small argument for boredom",body:"# A small argument for boredom\n\nBoredom is the **gap** where your own thoughts get room.\n\n> The mind wanders to where it wants to go.\n\nSo I’m leaving more gaps.\n\n#boredom #notes"},
 {date:"2026-10-16",title:"Recipe: lazy soup",body:"# Recipe: lazy soup\n\n1. Onion, garlic, oil\n2. Whatever vegetables are tired\n3. Stock, salt, lemon\n\nSimmer until you stop checking on it."},
 {date:"2026-10-20",title:"Week in review",body:"# Week in review\n\nGood: finished the draft.\n\nBad: skipped two walks.\n\nNext: **less planning, more doing**.\n\n#weekly"},
 {date:"2026-10-21",title:"On keeping a site small",body:"# On keeping a site small\n\nThis page is HTML, CSS, and one script. No framework, no build step.\n\nThe constraint is the feature.\n\n#meta #notebook"}
];
/* Sample photo dump with gradient placeholders. Safe to delete. */
const ph = (a,b) => "data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient></defs><rect width="800" height="600" fill="url(#g)"/></svg>').replace(/\(/g,"%28").replace(/\)/g,"%29");
demo.push({date:"2026-10-22",title:"Hudson Valley",body:"# Hudson Valley\n\n![Placeholder photo, morning fog]("+ph("#b8c4d6","#eef1f4")+")\n\nCold morning, fog coming off the river.\n\n![Placeholder photo, barn at dusk]("+ph("#FF948F","#5a3b4e")+")\n![Placeholder photo, trail]("+ph("#8fb3a3","#2f4a45")+")\n\nThe light lasted about ten minutes. #photos"});

/* ---- Tiny Markdown renderer ---- */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function inline(s){
  s = esc(s);
  const codes = [];
  s = s.replace(/`([^`]+)`/g,(_,c)=>{codes.push(c);return "\u0000"+(codes.length-1)+"\u0000"});
  s = s.replace(/(^|\s)#([A-Za-z][\w-]*)/g,(_,p,t)=>p+'<a href="#" class="tag" data-tag="'+t.toLowerCase()+'">#'+t+'</a>');
  s = s.replace(/\[([^\]]+)\]\(((?:https?:|mailto:|#)[^)\s]*)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
       .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
       .replace(/\*([^*]+)\*/g,"<em>$1</em>");
  return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>"<code>"+codes[i]+"</code>");
}
function md(src){
  const L = src.replace(/\r/g,"").split("\n"); let out = "", i = 0;
  while(i < L.length){
    const l = L[i];
    if(!l.trim()){i++;continue}
    if(/^```/.test(l)){const b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;out+="<pre><code>"+esc(b.join("\n"))+"</code></pre>";continue}
    let m;
    if(m = l.match(/^(#{1,3})\s+(.*)/)){out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`;i++;continue}
    if(/^(-{3,}|\*{3,})\s*$/.test(l)){out+="<hr>";i++;continue}
    if(/^>/.test(l)){const b=[];while(i<L.length&&/^>/.test(L[i]))b.push(L[i++].replace(/^>\s?/,""));out+="<blockquote>"+b.join("\n").split(/\n\s*\n/).map(p=>"<p>"+inline(p.replace(/\n/g," "))+"</p>").join("")+"</blockquote>";continue}
    if(m = l.match(/^!\[([^\]]*)\]\(([^)\s]+)\)\s*$/)){out+='<img src="'+imgSrc(m[2]).replace(/"/g,"%22")+'" alt="'+esc(m[1]).replace(/"/g,"&quot;")+'" loading="lazy">';i++;continue}
    if(/^\s*[-*]\s+/.test(l)){const b=[];while(i<L.length&&/^\s*[-*]\s+/.test(L[i]))b.push("<li>"+inline(L[i++].replace(/^\s*[-*]\s+/,""))+"</li>");out+="<ul>"+b.join("")+"</ul>";continue}
    if(/^\s*\d+\.\s+/.test(l)){const b=[];while(i<L.length&&/^\s*\d+\.\s+/.test(L[i]))b.push("<li>"+inline(L[i++].replace(/^\s*\d+\.\s+/,""))+"</li>");out+="<ol>"+b.join("")+"</ol>";continue}
    const p=[];while(i<L.length&&L[i].trim()&&!/^(#{1,3}\s|```|>|\s*[-*]\s+|\s*\d+\.\s+|-{3,}\s*$|!\[[^\]]*\]\([^)\s]+\)\s*$)/.test(L[i]))p.push(L[i++]);
    out+="<p>"+inline(p.join(" "))+"</p>";
  }
  return out;
}

/* ---- Calendar ---- */
const parse = s => {const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
let entries = [], first, last;
const noCode = b => b.replace(/```[\s\S]*?```/g,"").replace(/`[^`]*`/g,"");
function ingest(raw){
  entries = raw.map(r=>({...r, d:parse(r.date),
    imgs:[...noCode(r.body).matchAll(/^!\[([^\]]*)\]\(([^)\s]+)\)\s*$/gm)].map(m=>({alt:m[1],src:m[2]})),
    tags:[...new Set([...noCode(r.body).matchAll(/(?:^|\s)#([A-Za-z][\w-]*)/g)].map(m=>m[1].toLowerCase()))],
    text:(r.title+" "+r.body).toLowerCase()}))
    .filter(e=>!isNaN(e.d))
    .sort((a,b)=>a.date.localeCompare(b.date)||(a.id||"").localeCompare(b.id||""));
  first = entries.length ? entries[0].d : today;
  last = entries.length && entries[entries.length-1].d > today ? entries[entries.length-1].d : today;
}
const MON = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const mon3 = d => MON[d.getMonth()].slice(0,3);
const weekStart = d => {const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const $ = id => document.getElementById(id);
const today = new Date();
let view = {y:today.getFullYear(), m:today.getMonth()};

const qa = s => esc(s).replace(/"/g,"&quot;");
const tile = e => {
  const i = entries.indexOf(e), n = e.imgs.length, d = `<span class="d">${e.d.getDate()}</span>`;
  if(!n) return `<button class="tile" data-i="${i}" aria-label="${qa(mon3(e.d)+" "+e.d.getDate()+", "+e.title)}">${d}<span class="t">${esc(e.title)}</span></button>`;
  return `<button class="tile photo" data-i="${i}" aria-label="${qa(mon3(e.d)+" "+e.d.getDate()+", "+(e.untitled?"Photos":e.title)+", "+n+(n===1?" photo":" photos"))}"><img src="${qa(imgSrc(e.imgs[0].src))}" alt="" loading="lazy">`+
    d+(e.untitled?"":`<span class="t">${esc(e.title)}</span>`)+`</button>`;
};
/* Shows the day's four most recent posts; the bubble counts all of them. */
const multiTile = day => {
  const e = day[0], shown = day.slice(-4);
  const sub = shown.map(x=>`<span class="s">`+(x.imgs.length?`<img src="${qa(imgSrc(x.imgs[0].src))}" alt="" loading="lazy">`:`<span>${esc(x.title)}</span>`)+`</span>`).join("")+(shown.length===3?`<span class="s"></span>`:"");
  return `<button class="tile multi${shown[0].imgs.length?" dark":""}" data-day="${e.date}" aria-label="${qa(mon3(e.d)+" "+e.d.getDate()+", "+day.length+" posts")}">`+
    `<span class="sub${shown.length>2?" four":""}">${sub}</span><span class="d">${e.d.getDate()}</span><span class="n">${day.length}</span></button>`;
};
function render(){
  $("mt").textContent = MON[view.m]+" "+view.y;
  const monthEnd = new Date(view.y,view.m+1,0), cells = [];
  const midnight = new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const isToday = d => d.getFullYear()===today.getFullYear() && d.getMonth()===today.getMonth() && d.getDate()===today.getDate();
  for(let d = weekStart(new Date(view.y,view.m,1)); d <= monthEnd || d.getDay()!==1; d = new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)){
    if(d.getMonth()!==view.m){cells.push(`<div class="day out"></div>`);continue}
    const day = entries.filter(e=>+e.d===+d), now = isToday(d) ? " today" : d < midnight ? " past" : "";
    cells.push(day.length ? `<div class="day has${now}">${day.length > 1 ? multiTile(day) : tile(day[0])}</div>`
      : `<div class="day${now}"${now===" today"?' aria-current="date"':""}>${d.getDate()}</div>`);
  }
  $("cal").innerHTML = cells.join("");
  $("pm").disabled = view.y===first.getFullYear() && view.m===first.getMonth();
  $("nm").disabled = view.y===last.getFullYear() && view.m===last.getMonth();
}
function shift(n){const d=new Date(view.y,view.m+n,1);view={y:d.getFullYear(),m:d.getMonth()};render()}
$("pm").onclick=()=>shift(-1); $("nm").onclick=()=>shift(1);

/* ---- Lightbox ---- */
const lb = $("lb");
/* The lightbox shows one post, or a picker for a day with several. span holds the list positions it covers. */
let span = [-1,-1];
const longDate = d => d.toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
function present(e,html,from,to){
  span = [from,to];
  $("art").innerHTML = html; $("art").scrollTop = 0; lb.scrollTop = 0;
  $("prev").disabled = from<=0; $("next").disabled = to<0||to>=list.length-1;
  view = {y:e.d.getFullYear(), m:e.d.getMonth()}; render();
  if(!lb.open) lb.showModal();
}
function show(i){
  if(i<0||i>=entries.length) return;
  const e = entries[i], p = list.indexOf(i), n = entries.filter(x=>x.date===e.date).length;
  present(e,`<p class="when">${longDate(e.d)}`+(n>1?` · <button class="back" data-day="${e.date}">${n} posts</button>`:"")+`</p>`+md(e.body),p,p);
}
function showDay(date){
  const ps = list.map((i,p)=>[i,p]).filter(([i])=>entries[i].date===date);
  if(!ps.length) return;
  const e = entries[ps[0][0]];
  present(e,`<p class="when">${longDate(e.d)} · ${ps.length} posts</p><div class="pick">${ps.map(([i])=>tile(entries[i])).join("")}</div>`,ps[0][1],ps[ps.length-1][1]);
}
$("cal").addEventListener("click",ev=>{const t=ev.target.closest("[data-day],[data-i]");if(!t)return;t.dataset.day?showDay(t.dataset.day):show(+t.dataset.i)});
$("art").addEventListener("click",ev=>{const t=ev.target.closest(".pick [data-i],.back");if(!t)return;t.dataset.day?showDay(t.dataset.day):show(+t.dataset.i)});
function step(n){const p=n<0?span[0]-1:span[1]+1;if(p>=0&&p<list.length)show(list[p])}
$("prev").onclick=()=>step(-1); $("next").onclick=()=>step(1);
$("x").onclick=()=>lb.close();
const zoom = $("zoom");
$("art").addEventListener("click",ev=>{const im=ev.target.closest("img");if(!im||im.closest(".pick"))return;$("zimg").src=im.src;$("zimg").alt=im.alt;zoom.showModal()});
zoom.addEventListener("click",()=>zoom.close());
lb.addEventListener("click",ev=>{if(ev.target===lb||ev.target.classList.contains("wrap"))lb.close()});
lb.addEventListener("keydown",ev=>{
  if(ev.key==="ArrowLeft"){ev.preventDefault();step(-1)}
  if(ev.key==="ArrowRight"){ev.preventDefault();step(1)}
});
/* ---- Search & tags ---- */
let list = entries.map((_,i)=>i), q = "", sel = new Set();
const allTags = () => {const m={};entries.forEach(e=>e.tags.forEach(t=>m[t]=(m[t]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))};
const terms = () => q.toLowerCase().split(/\s+/).filter(Boolean);
const matches = e => [...sel].every(t=>e.tags.includes(t)) && terms().every(w=>e.text.includes(w));
function snippet(e,ts){
  const t = e.body.replace(/^#{1,3}\s+.*\n?/,"").replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/```/g,"").replace(/[*`>]/g,"").replace(/\[([^\]]+)\]\([^)]*\)/g,"$1").replace(/\s+/g," ").trim();
  const low = t.toLowerCase(); let at = 0;
  for(const w of ts){const k=low.indexOf(w);if(k>=0){at=Math.max(0,k-50);break}}
  let s = esc(t.slice(at,at+150));
  ts.forEach(w=>{s=s.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),m=>"<mark>"+m+"</mark>")});
  return (at?"…":"")+s+(at+150<t.length?"…":"");
}
function draw(){
  const on = q.trim() || sel.size;
  $("calwrap").hidden = !!on; $("results").hidden = !on; $("clear").hidden = !on;
  $("tags").innerHTML = allTags().map(([t,n])=>`<button class="tag${sel.has(t)?" on":""}" data-tag="${t}" aria-pressed="${sel.has(t)}">#${t}<small>${n}</small></button>`).join("");
  if(!on){list = entries.map((_,i)=>i);return}
  const ts = terms();
  list = entries.map((_,i)=>i).filter(i=>matches(entries[i]));
  let html = `<p class="count" aria-live="polite">${list.length} ${list.length===1?"entry":"entries"}</p>`, mk = "";
  [...list].reverse().forEach(i=>{
    const e = entries[i], k = MON[e.d.getMonth()]+" "+e.d.getFullYear();
    if(k!==mk){mk=k;html+=`<h3 class="rm">${k}</h3>`}
    html += `<button class="res" data-i="${i}"><span class="rd">${mon3(e.d)} ${e.d.getDate()}</span><span class="rt">${esc(e.title)}</span><br><span class="rs">${snippet(e,ts)}</span></button>`;
  });
  if(!list.length) html += `<p class="rs">Nothing matches. Try fewer words or clear a tag.</p>`;
  $("results").innerHTML = html;
}
$("q").addEventListener("input",ev=>{q=ev.target.value;draw()});
$("q").addEventListener("keydown",ev=>{if(ev.key==="Escape"){q="";ev.target.value="";draw()}});
$("clear").onclick = () => {q="";sel.clear();$("q").value="";draw()};
$("tags").addEventListener("click",ev=>{const t=ev.target.closest("[data-tag]");if(!t)return;const g=t.dataset.tag;sel.has(g)?sel.delete(g):sel.add(g);draw()});
$("art").addEventListener("click",ev=>{const t=ev.target.closest("[data-tag]");if(!t)return;ev.preventDefault();lb.close();q="";$("q").value="";sel=new Set([t.dataset.tag]);draw();window.scrollTo(0,0)});
$("results").addEventListener("click",ev=>{const r=ev.target.closest(".res");if(r)show(+r.dataset.i)});
document.addEventListener("keydown",ev=>{if(ev.key==="/"&&!lb.open&&document.activeElement!==$("q")){ev.preventDefault();$("q").focus()}});
/* ---- Load entries from the GitHub repo ---- */
function repoName(){
  if(REPO) return REPO;
  const h = location.hostname, p = location.pathname.split("/")[1];
  return h.endsWith(".github.io") ? h.split(".")[0]+"/"+(p||h) : "";
}
async function loadEntries(){
  const repo = repoName();
  if(!repo) throw new Error("No repo");
  const r = await fetch("https://api.github.com/repos/"+repo+"/contents/"+FOLDER+(BRANCH?"?ref="+BRANCH:""));
  const files = await r.json();
  if(!Array.isArray(files)) throw new Error("No folder");
  return Promise.all(files.filter(f=>/^\d{4}-\d{2}-\d{2}.*\.md$/i.test(f.name)).map(async f=>{
    const body = await (await fetch(FOLDER+"/"+encodeURIComponent(f.name))).text();
    const h = body.match(/^#\s+(.+)$/m);
    return {id:f.name, date:f.name.slice(0,10), title:h?h[1].replace(/[*_`]/g,"").trim():(f.name.slice(11,-3).replace(/-/g," ")||f.name.slice(0,10)), body, untitled:!h};
  }));
}
loadEntries().catch(()=>{const n=$("note");n.textContent="Showing sample entries. Couldn’t read the entries folder from GitHub.";n.hidden=false;return demo})
  .then(raw=>{ingest(raw);draw();render()});
</script>
</body>
