<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="theme.js"></script>
<title>Audio · Loggin’ Chung</title>
<link rel="stylesheet" href="site.css">
<style>
/* Audio page (MOCKUP): every audio file posted to the log, newest first, playing one after another in a single player.
   The list is written by hand for now; build/build.js could fill it in from the posts the way it fills in archive.html.
   Shared styles are in site.css. */
.tape{max-width:44rem}
/* The deck: what's playing, the one shared player, and its controls. Sticks to the top while you scroll the list. */
.deck{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;margin:0 0 1.75rem;padding:.9rem 1rem 1rem;border:1px dotted var(--line);border-radius:1px;background:var(--panel)}
.deck .now{display:flex;align-items:baseline;gap:.6rem;min-height:1.5em;margin:0 0 .15rem;color:var(--note);overflow-wrap:anywhere}
.deck .now::before{content:"♪";flex:none}
.deck .from{margin:0 0 .6rem;font-size:.75rem;color:var(--muted)}
.deck .from a{color:inherit}
.deck audio{display:block;width:100%;height:2.25rem;accent-color:var(--accent)}
.deck .controls{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.25rem;margin:.65rem 0 0;font-size:.8rem}
.deck .controls .circle{width:2rem;height:2rem;padding:0;font-size:.85rem}
.deck .toggle{color:var(--muted)}
.deck .toggle[aria-pressed="true"]{background:var(--accent);color:#000;text-decoration-color:transparent}
.deck .count{margin-left:auto;color:var(--muted)}
/* The list: months, then a row per track */
.month{margin:0 0 1.5rem;border-bottom:1px dotted var(--line)}
.month h3{margin:0 0 .3rem}
.month h3 small{color:var(--muted);font-size:.75rem;font-weight:400;margin-left:.4rem}
.month ol{list-style:none;margin:0;padding:0}
.track-row{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;column-gap:.75rem;align-items:center;padding:.5rem 0;border-top:1px dotted var(--line)}
.track-row .play{width:1.8rem;height:1.8rem;padding:0;font-size:.7rem;line-height:1}
.track-row .name{cursor:pointer;overflow-wrap:anywhere}
.track-row .name:hover{text-decoration:underline dotted var(--accent) 2px;text-underline-offset:.25em}
.track-row .meta{display:block;font-size:.75rem;color:var(--muted)}
.track-row .meta a{color:inherit}
.track-row .meta a:hover{color:#000}
.track-row .rec{font-size:.75rem;color:var(--muted);text-align:right;white-space:nowrap}
/* The track that's loaded in the deck: coral, with its button showing pause while it plays */
.track-row.on .name{color:var(--note);font-weight:700}
.track-row.on .play{border-color:var(--accent);color:var(--accent)}
.mock{margin:0 0 1.25rem;max-width:44rem;font-size:.75rem;color:var(--muted)}
@media (max-width:40rem){
  .track-row{grid-template-columns:2rem minmax(0,1fr)}
  .track-row .rec{grid-column:2;text-align:left}
}
</style>
</head>
<body>
<main>
  <h1><a href="https://loganchungr.github.io/">Loggin’ Chung</a></h1>
  <nav class="links"><a href="https://loganchungr.github.io/">home</a><a href="lookout.html">lookout</a><a href="watch.html">watch</a><a href="context.html">context</a><a href="audio.html" aria-current="page">audio</a></nav>
  <p class="mock">mockup · the tracks below are the ones already posted, listed by hand</p>

  <div class="tape">
    <section class="deck" aria-label="Player">
      <p class="now" id="now">pick a track, or press play</p>
      <p class="from" id="from">&nbsp;</p>
      <audio id="player" controls preload="none"></audio>
      <div class="controls">
        <button class="circle" id="prev" aria-label="Previous track" title="Previous track">&larr;</button>
        <button class="circle" id="next" aria-label="Next track" title="Next track">&rarr;</button>
        <button class="linkbtn toggle" id="shuffle" aria-pressed="false">shuffle</button>
        <button class="linkbtn toggle" id="onward" aria-pressed="true">keep playing</button>
        <span class="count" id="count"></span>
      </div>
    </section>

    <div id="list"></div>
  </div>
</main>
<script>
/* Each track: the caption (from the link's text, or the file's name), where it plays from, the post it came from, and the
   date in the filename when it has one (26.11-14 → recorded Nov 14). When this is built for real, build/build.js would
   collect these from every post's audio lines and write them here. */
var TRACKS = [
  {title:"14.01 Nov26", rec:"2026-11-26",
   src:"https://www.dropbox.com/scl/fi/3vtllqu6ufjgudoiewm6m/26.11-26-14.01_Nov26.m4a?rlkey=w5qeb5bcktrhzjw0jvms5fwq0&raw=1",
   post:"it's thanksgiving", date:"2026-11-26", url:"2026-11-26-it-s-thanksgiving", tags:["music"]},
  {title:"Greg Freeman — Bury Me the Shovel (live at Webster Hall)", rec:"2026-11-20",
   src:"https://www.dropbox.com/scl/fi/6at2ocnb82ktwmbcum2lg/26.11-20-GREG-FREEMAN-BURY-ME-THE-SHOVEL-LIVE-AT-WEBSTER-HALL.mp3?rlkey=p4l0av7cow5sa5tg0qka0jedt&raw=1",
   post:"yes culture, and yes more rock and roll", date:"2026-11-20", url:"2026-11-20-yes-culture-and-yes-more-rock-and-roll", tags:[]},
  {title:"Our Poem", rec:"2026-11-20",
   src:"https://www.dropbox.com/scl/fi/9xc6of4aqdqw14svqqd0b/26.11-20-Our-Poem.mp3?rlkey=buit8c6ca7vzenrpnmwy84amv&raw=1",
   post:"birthday", date:"2026-11-19", url:"2026-11-19-birthday", tags:[]},
  {title:"Happy Birthday", rec:"2026-11-20",
   src:"https://www.dropbox.com/scl/fi/rrudp48kz8kvp7js223ly/26.11-20-Happy-Birthday.mp3?rlkey=p9edbwkv63s0c8atdj388wuvo&raw=1",
   post:"birthday", date:"2026-11-19", url:"2026-11-19-birthday", tags:[]},
  {title:"dc4c", rec:"2026-11-14",
   src:"https://www.dropbox.com/scl/fi/qpazlsn2a1x9hhkffjkti/26.11-14-dc4c.mp3?rlkey=5zqqenmrsk28fi1mly1q1gjdf&raw=1",
   post:"two from :)", date:"2026-11-13", url:"2026-11-13-two-from", tags:[]},
  {title:"Emma Ogier Land (live at Baby’s All Right)", rec:"2026-11-14",
   src:"https://www.dropbox.com/scl/fi/x268vt0jsm2qmrkqkgm9t/26.11-14-EMMA-OGIER-LAND-LIVE-AT-BABY-S-ALL-RIGHT.mp3?rlkey=dtvy19jjic110iee0iz254luq&raw=1",
   post:"two from :)", date:"2026-11-13", url:"2026-11-13-two-from", tags:[]}
];

var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var $ = function (id) { return document.getElementById(id); };
var player = $("player"), current = -1, order = TRACKS.map(function (_, i) { return i; });
function short(d) { var p = d.split("-"); return MONTHS[p[1]-1].slice(0,3) + " " + (+p[2]); }
function esc(s) { return s.replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

// The list, by the month each track was posted, newest first
var months = [], rows = [];
TRACKS.forEach(function (t, i) {
  var key = t.date.slice(0,7), m = months[months.length-1];
  if (!m || m.key !== key) months.push(m = {key:key, items:[]});
  m.items.push(i);
});
$("list").innerHTML = months.map(function (m) {
  var y = m.key.slice(0,4), mo = MONTHS[m.key.slice(5)-1];
  return '<section class="month"><h3>' + mo + " " + y + "<small>" + m.items.length + "</small></h3><ol>" +
    m.items.map(function (i) {
      var t = TRACKS[i];
      return '<li class="track-row" data-i="' + i + '">' +
        '<button class="circle play" aria-label="Play ' + esc(t.title) + '">&#9654;</button>' +
        '<div><span class="name">' + esc(t.title) + '</span>' +
        '<span class="meta">from <a href="./#' + t.url + '">' + esc(t.post) + "</a>, " + short(t.date) +
        (t.tags.length ? " · " + t.tags.map(function (g) { return "#" + g; }).join(" ") : "") + "</span></div>" +
        '<span class="rec">rec. ' + short(t.rec) + "</span></li>";
    }).join("") + "</ol></section>";
}).join("");
$("count").textContent = TRACKS.length + " tracks";
document.querySelectorAll(".track-row").forEach(function (li) { rows[+li.dataset.i] = li; });

function paint() {
  rows.forEach(function (li, i) {
    var on = i === current;
    li.classList.toggle("on", on);
    var b = li.querySelector(".play");
    b.innerHTML = on && !player.paused ? "&#10074;&#10074;" : "&#9654;";
    b.setAttribute("aria-label", (on && !player.paused ? "Pause " : "Play ") + TRACKS[i].title);
  });
}
function load(i, play) {
  current = i;
  var t = TRACKS[i];
  player.src = t.src;
  $("now").textContent = t.title;
  $("from").innerHTML = 'from <a href="./#' + t.url + '">' + esc(t.post) + "</a> · " + short(t.date);
  if (play) player.play().catch(function () {});
  paint();
}
function step(dir) {
  var k = order.indexOf(current);
  var n = order[(k < 0 ? 0 : k + dir + order.length) % order.length];
  load(n, true);
}

$("list").addEventListener("click", function (e) {
  var li = e.target.closest(".track-row");
  if (!li || e.target.closest("a")) return;
  var i = +li.dataset.i;
  if (i === current) { player.paused ? player.play() : player.pause(); }
  else load(i, true);
});
$("prev").onclick = function () { step(-1); };
$("next").onclick = function () { step(1); };
$("shuffle").onclick = function () {
  var on = this.getAttribute("aria-pressed") !== "true";
  this.setAttribute("aria-pressed", on);
  order = TRACKS.map(function (_, i) { return i; });
  if (on) for (var i = order.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = order[i]; order[i] = order[j]; order[j] = x; }
};
$("onward").onclick = function () { this.setAttribute("aria-pressed", this.getAttribute("aria-pressed") !== "true"); };
// Pressing play on the deck with nothing loaded starts at the top
player.addEventListener("play", function () { if (current < 0) load(order[0], true); paint(); });
player.addEventListener("pause", paint);
player.addEventListener("ended", function () { if ($("onward").getAttribute("aria-pressed") === "true") step(1); else paint(); });
</script>
</body>
</html>
