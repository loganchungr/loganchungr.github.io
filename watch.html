<!DOCTYPE html>
<html lang="en" data-theme="dark">  <!-- the watch page is always dark: no theme.js, so no toggle, and the other pages' setting is untouched -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch · Loggin’ Chung</title>
<link rel="stylesheet" href="site.css">
<style>
/* Watch page: pick TV or a movie, then watch a shuffled YouTube playlist. Shared styles are in site.css. */
.pick{font:inherit;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-decoration:underline dotted var(--accent) 2px;text-underline-offset:.25em}
.pick:hover{background:var(--accent);color:#000;text-decoration-color:transparent}
.choices{display:flex;flex-wrap:wrap;gap:.5rem 2rem;font-size:1.25rem;margin:0}
/* The screen is 16:9, as wide as fits on the window's height, with the up and down arrows beside it */
.tv{display:flex;align-items:center;gap:1rem}
.screen{width:min(100% - 4rem,(100vh - 16rem) * 16 / 9);min-width:min(100% - 4rem,20rem);aspect-ratio:16/9;background:#000;border:1px dotted var(--line);border-radius:1px;overflow:hidden}
.screen iframe{display:block;width:100%;height:100%;border:0}
.remote{display:flex;flex-direction:column;gap:.75rem}
.remote .circle{width:3rem;height:3rem;font-size:1.2rem;display:grid;place-items:center;padding:0}
.remote .sep{height:.5rem;width:.5rem}  /* sets the channel arrows apart from play, sound and full screen */
.remote svg{width:1.1rem;height:1.1rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Full screen takes the screen and its controls, on black */
.tv:fullscreen{background:#000;justify-content:center;padding:1rem}
.tv:fullscreen .screen{width:min(100% - 4rem,(100vh - 2rem) * 16 / 9);border-color:transparent}
.tv:-webkit-full-screen{background:#000;justify-content:center;padding:1rem}
.tv:-webkit-full-screen .screen{width:min(100% - 4rem,(100vh - 2rem) * 16 / 9);border-color:transparent}
/* A small "i" under the screen, at the left; the info box opens from it */
#about{display:block;width:1.6rem;height:1.6rem;margin-top:.75rem;padding:0;font-size:.8rem;font-style:italic;font-weight:700}
#about[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.info{max-width:44rem;margin-top:.4rem;background:var(--panel);border:1px dotted var(--line);border-radius:1px;padding:1rem 1.25rem}
.info p{margin:0}
.info .by{color:var(--muted);font-size:.85rem}
.info .note{margin-top:.6rem}
.info .or{margin-top:.9rem;color:var(--muted);font-size:.85rem}
.or .pick:not(:hover){color:var(--muted)}
@media (max-width:40rem){
  /* On phones the remote sits in a row under the screen */
  .tv{flex-direction:column;align-items:stretch}
  .screen{width:100%;min-width:0}
  .remote{flex-direction:row;justify-content:center}
}
</style>
</head>
<body>
<main>
  <h1><a href="https://loganchungr.github.io/">Loggin’ Chung</a></h1>
  <nav class="links"><a href="https://loganchungr.github.io/">home</a><a href="lookout.html">lookout</a><a href="watch.html" aria-current="page">watch</a><a href="context.html">context</a></nav>

  <section id="ask">
    <h2>what would you like to watch?</h2>
    <p class="choices"><button class="pick" data-kind="tv">watch TV</button><button class="pick" data-kind="movie">watch a movie</button></p>
  </section>

  <section id="watching" hidden>
    <div class="tv">
      <div class="screen"><div id="screen"></div></div>
      <div class="remote">
        <button class="circle" id="up" aria-label="Next video" title="Next video">↑</button>
        <button class="circle" id="down" aria-label="Previous video" title="Previous video">↓</button>
        <span class="sep"></span>
        <button class="circle" id="play"></button>
        <button class="circle" id="sound"></button>
        <button class="circle" id="full"></button>
      </div>
    </div>
    <button class="circle" id="about" aria-label="About this video" aria-expanded="false" aria-controls="panel" title="About this video">i</button>
    <div class="info" id="panel" hidden>
      <div id="info" aria-live="polite"></div>
      <p class="or"><em>or</em> <button class="pick" id="other"></button></p>
    </div>
  </section>
</main>
<script>
/* Your playlists: the part after "list=" in each playlist's address. They need to be public or unlisted. */
const PLAYLISTS = {
  tv: "PLAZAt-NcF-m0",
  movie: "PLbbvEYpp8Wao"
};
/* Optional: a note of your own under a video's title. Use the video's ID (the part after "v=" or "youtu.be/"). */
const NOTES = {
  // "dQw4w9WgXcQ": "a note about this one",
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const shuffle = a => { a = [...a]; for(let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const say = text => { $("info").innerHTML = `<p class="by">${esc(text)}</p>`; };
const tell = text => { say(text); $("panel").hidden = false; $("about").setAttribute("aria-expanded", true); };  // a problem: open the panel so it's seen

/* YouTube's player script loads only once someone picks something */
let api;
const youtube = () => api || (api = new Promise((ok, fail) => {
  window.onYouTubeIframeAPIReady = ok;
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api"; s.onerror = fail;
  document.head.appendChild(s);
}));

let player, order = [], shown = "", misses = 0, skipping, dir = 1;  // dir: which way the last change of channel went
let playing = false, muted = false;

/* Play/pause, sound and full screen, drawn like the light/dark toggle's icons */
const svg = d => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICON = {
  play: svg('<path d="M8 5v14l11-7z"/>'), pause: svg('<path d="M9 5v14M15 5v14"/>'),
  sound: svg('<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9a4 4 0 0 1 0 6"/>'), muted: svg('<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/>'),
  full: svg('<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>'), exit: svg('<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>')
};
const box = document.querySelector(".tv");
const fullNow = () => document.fullscreenElement || document.webkitFullscreenElement;
function show(id, icon, label){ $(id).innerHTML = ICON[icon]; $(id).setAttribute("aria-label", label); $(id).title = label; }
function paint(){
  show("play", playing ? "pause" : "play", playing ? "Pause" : "Play");
  show("sound", muted ? "muted" : "sound", muted ? "Turn the sound on" : "Mute");
  show("full", fullNow() ? "exit" : "full", fullNow() ? "Exit full screen" : "Full screen");
}
async function choose(kind){
  $("ask").hidden = true; $("watching").hidden = false;
  $("other").textContent = kind === "tv" ? "watch a movie instead" : "watch TV instead";
  $("other").dataset.kind = kind === "tv" ? "movie" : "tv";
  if(!PLAYLISTS[kind]) return tell(`No ${kind === "tv" ? "TV" : "movie"} playlist yet.`);
  say("tuning in…");
  try{ await youtube() }catch(err){ return tell("Couldn’t reach YouTube. Try again in a bit.") }
  if(player) player.destroy();
  $("screen").replaceWith(Object.assign(document.createElement("div"), {id:"screen"}));
  clearTimeout(skipping); order = []; shown = ""; misses = 0; dir = 1;
  player = new YT.Player("screen", {
    host: "https://www.youtube-nocookie.com",  // YouTube's privacy-enhanced player
    // YouTube's own control bar, with no annotations and related videos from the same channel only
    playerVars: {listType:"playlist", list:PLAYLISTS[kind], playsinline:1, rel:0, iv_load_policy:3},
    events: {onReady:tune, onStateChange:changed, onError:skip}
  });
}
/* Once YouTube has the playlist's videos, shuffle them and start at the first, so every visit starts somewhere new */
function tune(){
  if(muted) player.mute();
  let tries = 0;
  (function wait(){
    const ids = player.getPlaylist && player.getPlaylist();
    if(ids && ids.length){ order = shuffle(ids); player.loadPlaylist(order, 0); return; }
    if(++tries < 50) setTimeout(wait, 200); else tell("Couldn’t load this playlist. Is it public or unlisted?");
  })();
}
/* Up: the next video, or a fresh shuffle after the last one. Down: the previous video. */
function next(){
  clearTimeout(skipping); dir = 1;
  if(!order.length) return;
  if(player.getPlaylistIndex() >= order.length-1){ order = shuffle(order); player.loadPlaylist(order, 0); }
  else player.nextVideo();
}
function prev(){
  clearTimeout(skipping); dir = -1;
  if(!order.length) return;
  const i = player.getPlaylistIndex();
  if(i > 0) player.previousVideo(); else player.playVideoAt(order.length-1);
}
function changed(ev){
  if(ev.data === YT.PlayerState.ENDED) return next();
  playing = ev.data === YT.PlayerState.PLAYING || ev.data === YT.PlayerState.BUFFERING; paint();
  const d = player.getVideoData && player.getVideoData();
  if(!d || !d.video_id || !d.title || d.video_id === shown) return;
  shown = d.video_id; misses = 0;
  $("info").innerHTML = `<p><b>${esc(d.title)}</b></p>` + (d.author ? `<p class="by">${esc(d.author)}</p>` : "") +
    (NOTES[d.video_id] ? `<p class="note">${esc(NOTES[d.video_id])}</p>` : "");
}
/* A video that won't play here (removed, private, or its uploader turned off embedding): skip it */
function skip(){
  if(++misses > order.length) return tell("None of these videos will play here right now.");
  clearTimeout(skipping); skipping = setTimeout(dir > 0 ? next : prev, 600);
}

document.querySelectorAll("#ask [data-kind]").forEach(b => b.addEventListener("click", () => choose(b.dataset.kind)));
$("other").onclick = () => choose($("other").dataset.kind);
$("up").onclick = next; $("down").onclick = prev;
$("play").onclick = () => { if(!player || !player.pauseVideo) return; playing ? player.pauseVideo() : player.playVideo(); };
$("sound").onclick = () => { muted = !muted; if(player && player.mute) muted ? player.mute() : player.unMute(); paint(); };
/* Full screen, where the browser allows a page to do it (iPhones don't) */
if(!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) $("full").hidden = true;
$("full").onclick = () => fullNow() ? (document.exitFullscreen || document.webkitExitFullscreen).call(document) : (box.requestFullscreen || box.webkitRequestFullscreen).call(box);
["fullscreenchange","webkitfullscreenchange"].forEach(e => document.addEventListener(e, paint));
paint();
$("about").onclick = () => { const open = $("panel").hidden; $("panel").hidden = !open; $("about").setAttribute("aria-expanded", open); };
/* The keyboard's up and down arrows change the channel too (while the page, not the player, has focus) */
document.addEventListener("keydown", ev => {
  if($("watching").hidden || ev.altKey || ev.ctrlKey || ev.metaKey) return;
  if(ev.key === "ArrowUp"){ ev.preventDefault(); next(); }
  if(ev.key === "ArrowDown"){ ev.preventDefault(); prev(); }
});
</script>
</body>
</html>
