<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="theme.js"></script>
<title>Lookout · Loggin’ Chung</title>
<style>
:root{--bg:#fffbfa;--panel:#fff5f3;--ink:#000000;--muted:#6b6b6b;--line:#969696;--accent:#FF948F;--mono:"Courier New",Courier,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12161e;--panel:#1b212c;--ink:#e6eaf1;--muted:#8b95a7;--line:#303949;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 .85rem/1.6 var(--mono)}
main{max-width:64rem;padding:3rem 1.5rem 5rem}
h1{font:700 clamp(2.2rem,8vw,2.75rem)/1 var(--mono);margin:0 0 .5rem}
h1 a{color:inherit;text-decoration:none}
.links{display:flex;flex-wrap:wrap;gap:.25rem 1.5rem;margin:0 0 2.5rem;font-size:1rem}
.links a{color:var(--ink);text-decoration:underline dashed;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:.25em}
.links a:hover,.links a[aria-current]{background:var(--accent);color:#000;text-decoration-color:transparent}
h2{font:400 1.75rem/1 var(--mono);margin:0 0 1.25rem}
.frame{border:1px dashed var(--line);border-radius:1px;background:var(--panel);overflow:hidden}
iframe{display:block;width:100%;height:min(75vh,40rem);border:0}
.empty{padding:2rem;color:var(--muted);margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1><a href="https://loganchungr.github.io/">Loggin’ Chung</a></h1>
  <nav class="links"><a href="https://loganchungr.github.io/">home</a><a href="lookout.html" aria-current="page">lookout</a><a href="context.html">context</a></nav>
  <div class="frame" id="frame"></div>
</main>
<script>
const CAL_SRC = "https://calendar.google.com/calendar/embed?&wkst=1&ctz=America%2FNew_York&showPrint=0&showTitle=0&showDate=0&showTz=0&mode=AGENDA&src=ZGRkNzA4N2NhNDZjMGVkNmExMDkzZTEwN2EwNTMzMjk5Y2FiYjUwNGMzNzIzY2RjNjQ4NDhhYzJmMGRiNDNmYUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=Nzc1Yzk0ZGY4NWU1OWQwOGUxMmQ4NGI2YmY3YTNhOWRhOGUzODQ4ZTEzMmU5OTFlMDhkOWEyMWYzZDdiMjU3MUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=ZW4udXNhI2hvbGlkYXlAZ3JvdXAudi5jYWxlbmRhci5nb29nbGUuY29t&color=%23b39ddb&color=%23e67c73&color=%23009688";

const f = document.getElementById("frame");
if (CAL_SRC) {
  const i = document.createElement("iframe");
  i.src = CAL_SRC; i.title = "Calendar"; i.loading = "lazy";
  f.appendChild(i);
} else {
  f.innerHTML = '<p class="empty">No calendar yet. Add the embed link to <code>CAL_SRC</code> in lookout.html.</p>';
}
</script>
</body>
</html>
