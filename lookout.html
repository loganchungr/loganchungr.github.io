<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="theme.js"></script>
<title>Lookout · Loggin’ Chung</title>
<link rel="stylesheet" href="site.css">
<style>
/* Lookout page: the next three months of events from the Google Calendars. build/build.js fills in the list each time
   the site publishes, hourly too (see build/calendar.js). Shared styles are in site.css. */
:root{--concert:#3b78dc;--other:#e0675f}
:root[data-theme="dark"]{--concert:#7aa6f2;--other:#f08a84}
.key{display:flex;flex-wrap:wrap;gap:.25rem 1.25rem;color:var(--muted);font-size:.8rem;margin:0 0 1.75rem}
.key span::before,.event summary::before{content:"";flex:none;display:inline-block;width:.55rem;height:.55rem;border-radius:50%;margin-right:.45rem;background:var(--other)}
.key .concert::before,.event.concert summary::before{background:var(--concert)}
.events{max-width:44rem}
.day{margin:0 0 1.5rem}
.day h3{margin:0 0 .3rem}
.event{border-top:1px dotted var(--line)}
.event:last-child{border-bottom:1px dotted var(--line)}
/* Each event: its dot, its time and its title in three columns; opening it shows the rest under the title */
.event summary{display:grid;grid-template-columns:.55rem 7.5rem minmax(0,1fr);column-gap:.65rem;align-items:baseline;padding:.5rem 0;cursor:pointer;list-style:none}
.event summary::-webkit-details-marker{display:none}
.event summary::before{align-self:start;margin:.45em 0 0}
.event .time{color:var(--muted);font-size:.85rem}
.event summary:hover .what,.event[open] .what{text-decoration:underline dotted var(--accent) 2px;text-underline-offset:.25em}
.event>p,.event>div{margin:0 0 .5rem 9.35rem}
.event .about p{margin:0 0 .5rem}
.event .where,.event .link{overflow-wrap:anywhere}
.event .add{display:flex;flex-wrap:wrap;gap:.25rem 1.25rem;font-size:.85rem;padding-bottom:.4rem}
.none{color:var(--muted)}
@media (max-width:40rem){
  /* On phones the title goes under the time */
  .event summary{grid-template-columns:.55rem minmax(0,1fr)}
  .event .what{grid-column:2}
  .event>p,.event>div{margin-left:1.2rem}
}
</style>
</head>
<body>
<main>
  <h1><a href="https://loganchungr.github.io/">Loggin’ Chung</a></h1>
  <nav class="links"><a href="https://loganchungr.github.io/">home</a><a href="lookout.html" aria-current="page">lookout</a><a href="watch.html">watch</a><a href="context.html">context</a></nav>
  <p>This is a calendar of interesting events I find during my scrolls and my strolls. Sometimes a personal event will find its way onto this. Oops!</p>
  <p class="key"><span class="concert">concerts</span><span class="other">everything else</span></p>
  <div class="events">
<!-- events: build/build.js puts the next three months of events here -->
  </div>
</main>
</body>
</html>
