const f = document.getElementById("frame");
if (CAL_SRC) {
  const i = document.createElement("iframe");
  i.src = CAL_SRC; i.title = "Calendar"; i.loading = "lazy";
  f.appendChild(i);
} else {
  f.innerHTML = '<p class="empty">No calendar yet. Add the embed link to <code>CAL_SRC</code> in lookout.html.</p>';
}
</script>
