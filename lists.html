<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="theme.js"></script>
<title>Lists · Loggin’ Chung</title>
<link rel="stylesheet" href="site.css">
<style>
/* Lists page: square tiles that preview each list, and a lightbox with the whole thing. Shared styles are in site.css. */
.boxes{--gap:.75rem;display:grid;gap:var(--gap);max-width:60rem;
  grid-template-columns:repeat(auto-fill,minmax(max(14rem,(100% - 2 * var(--gap)) / 3),1fr))}  /* at most three across */
.list{position:relative;aspect-ratio:1;overflow:hidden;display:flex;flex-direction:column;gap:.6rem;padding:1rem 1.1rem;text-align:left;
  font:inherit;color:var(--ink);background:var(--field);border:1px dotted var(--line);border-radius:1px;cursor:pointer;transition:border-color .15s,transform .15s}
.list:hover{border-color:var(--accent);transform:translateY(-2px)}
.list .go{position:absolute;top:.5rem;right:.6rem;color:var(--muted);font-size:.8rem}
.list:hover .go{color:var(--accent)}
.list .title{font-weight:600;font-size:1.05rem;line-height:1.3;padding-right:1rem}
.list .it{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:.35rem 0;border-top:1px dotted var(--line)}
.list .it:first-of-type{border-top:0;padding-top:0}
.note{color:var(--muted)}
/* The whole list, in the lightbox */
#lb{--lb-width:34rem}
#art h2{font-weight:600;font-size:1.3rem;line-height:1.3;margin:0 0 1rem}
#art ul{list-style:none;margin:0;padding:0}
#art li{padding:.5rem 0;border-top:1px dotted var(--line);overflow-wrap:anywhere}
#art li:first-child{border-top:0;padding-top:0}
@media (prefers-reduced-motion:reduce){.list{transition:none}}
</style>
</head>
<body>
<main>
  <h1><a href="https://loganchungr.github.io/">Loggin’ Chung</a></h1>
  <nav class="links"><a href="https://loganchungr.github.io/">home</a><a href="lookout.html">lookout</a><a href="lists.html" aria-current="page">lists</a><a href="context.html">context</a></nav>
  <!-- Missives (short notes that expire after a week) will go above the lists. -->
  <div class="boxes" id="boxes"><p class="note">Loading lists…</p></div>
</main>

<dialog id="lb" aria-label="List">
  <button class="close" id="x" aria-label="Close">✕</button>
  <div class="wrap">
    <button class="circle nav" id="prev" aria-label="Previous list">←</button>
    <article id="art"></article>
    <button class="circle nav" id="next" aria-label="Next list">→</button>
  </div>
</dialog>

<script>
/* Each list is a Markdown file in lists/. An optional "# heading" is its title; every other non-empty line is an item
   ("- " or "1." in front is fine). Links work as [text](https://…) or as bare https:// addresses.
   Lists appear in filename order, so prefix names with numbers (01-albums.md) to reorder them. */
const REPO = "loganchungr/loganchungr.github.io", FOLDER = "lists", BRANCH = "update-2";
const PREVIEW = 6;  // items shown on a tile; the lightbox shows them all

const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const bare = u => u.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,"");
const inline = s => esc(s)
  .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|\s)(https?:\/\/[^\s<]+)/g,(_,p,u) => `${p}<a href="${u}" target="_blank" rel="noopener">${bare(u)}</a>`)
  .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
  .replace(/\*([^*]+)\*/g,"<em>$1</em>");
const plain = s => inline(s).replace(/<\/?a[^>]*>/g,"");  // tiles are buttons, so no links inside

function parse(src){
  const lines = src.replace(/\r/g,"").split("\n").map(l => l.trim()).filter(Boolean);
  const title = /^#\s/.test(lines[0] || "") ? lines.shift().replace(/^#\s+/,"") : "";
  return {title, items: lines.map(l => l.replace(/^(\d+\.|[-*])\s+/,""))};
}

let lists = [], cur = -1;
const tile = (l,i) => `<button class="list" data-i="${i}" aria-label="${esc((l.title || "List") + ", " + l.items.length + (l.items.length === 1 ? " item" : " items"))}">
  <span class="go" aria-hidden="true">↗</span>${l.title ? `<span class="title">${plain(l.title)}</span>` : ""}
  <span>${l.items.slice(0,PREVIEW).map(t => `<span class="it">${plain(t)}</span>`).join("")}</span></button>`;

const lb = $("lb");
function show(i){
  if (i < 0 || i >= lists.length) return;
  cur = i; const l = lists[i];
  $("art").innerHTML = (l.title ? `<h2>${inline(l.title)}</h2>` : "") + `<ul>${l.items.map(t => `<li>${inline(t)}</li>`).join("")}</ul>`;
  $("art").scrollTop = 0; lb.scrollTop = 0;
  $("prev").disabled = i === 0; $("next").disabled = i === lists.length - 1;
  if (!lb.open) lb.showModal();
}
$("boxes").addEventListener("click", ev => { const t = ev.target.closest(".list"); if (t) show(+t.dataset.i); });
$("prev").onclick = () => show(cur - 1); $("next").onclick = () => show(cur + 1);
$("x").onclick = () => lb.close();
lb.addEventListener("click", ev => { if (ev.target === lb || ev.target.classList.contains("wrap")) lb.close(); });
lb.addEventListener("keydown", ev => {
  if (ev.key === "ArrowLeft") { ev.preventDefault(); show(cur - 1); }
  if (ev.key === "ArrowRight") { ev.preventDefault(); show(cur + 1); }
});

(async () => {
  try {
    const files = await (await fetch(`https://api.github.com/repos/${REPO}/contents/${FOLDER}?ref=${BRANCH}`)).json();
    if (!Array.isArray(files)) throw new Error("No folder");
    const md = files.filter(f => /\.md$/i.test(f.name)).sort((a,b) => a.name.localeCompare(b.name));
    lists = (await Promise.all(md.map(async f => parse(await (await fetch(FOLDER + "/" + encodeURIComponent(f.name))).text()))))
      .filter(l => l.items.length);
    $("boxes").innerHTML = lists.length ? lists.map(tile).join("") : `<p class="note">No lists yet.</p>`;
  } catch (e) {
    $("boxes").innerHTML = `<p class="note">Couldn’t read the lists folder from GitHub. Try again in a minute.</p>`;
  }
})();
</script>
</body>
</html>
